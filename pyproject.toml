[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geoport"
version = "5.0.0.dev1"
description = "Local iOS location simulation with managed device sessions"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-only"
dependencies = [
  "flask>=3.1.3,<4",
  "waitress>=3.0.2,<4",
  "pymobiledevice3==11.3.0",
  "geographiclib>=2.1,<3",
  "gpxpy>=1.6.2,<2",
  "defusedxml>=0.7.1,<1",
  "requests>=2.32.4,<3",
  "httpx>=0.28,<1",
  "packaging>=25",
]

[project.scripts]
geoport = "geoport.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "build>=1.2"]
windows-build = [
    "pyinstaller>=6.22.2,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:xonsh"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/geoport"]

[tool.hatch.build.targets.sdist]
include = ["/src/geoport", "/tests", "/docs", "/packaging", "/.github", "/README.md", "/FAQ.md",
           "/LICENSE", "/pyproject.toml", "/uv.lock", "/package.json", "/package-lock.json"]
