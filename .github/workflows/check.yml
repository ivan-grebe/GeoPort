name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check src tests packaging
      - run: uv run ruff format --check src tests packaging
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ matrix.os }}
          path: dist/*
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: uv run --group windows-build pyinstaller --noconfirm packaging/GeoPort.spec
      - name: Check standalone startup
        if: runner.os == 'Windows'
        run: uv run python packaging/smoke_windows.py dist/GeoPort.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: GeoPort-Windows-x64
          path: dist/GeoPort.exe
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked --python 3.12
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
